<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theatre Accessibility & Family Guide | Behind the Magic Curtain</title>
    <meta name="description" content="Family accessibility and sensory guides for theatres across the West Midlands and beyond. Find relaxed performances, wheelchair access, and sensory breakout areas.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Theatre Accessibility Guide | Behind the Magic Curtain">
    <meta property="og:description" content="Detailed accessibility, relaxed performance info, and family facilities for UK theatres.">
    <meta property="og:image" content="images/theatre-guide-hippodrome.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&family=Raleway:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo"><a href="index.html">Behind the Magic Curtain</a></div>
            <nav class="main-nav">
                <button class="nav-toggle" aria-label="toggle navigation"><span class="hamburger"></span></button>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="whats-on.html">What's On</a></li>
                    <li><a href="theatre-guide.html" class="active">Theatre Guide</a></li>
                    <li><a href="tips-for-parents.html">Tips for Parents</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="disneyland-paris.html">Disneyland Paris</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Theatre Accessibility Guide</h1>
                <p>Sensory-friendly, relaxed, and accessible theatre across the West Midlands and beyond.</p>
            </div>
        </section>

        <!-- Search & Location Filter Controls -->
        <section class="filter-section">
            <div class="container" style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;">
                <input type="search" id="theatre-search-input" placeholder="Search theatre name, accessibility features..." style="flex: 1 1 260px; padding: 10px 18px; border-radius: 50px; border: 1.5px solid var(--color-border); outline: none; font-family: var(--font-body); font-size: 0.95rem;">
                <select id="theatre-location-filter" style="padding: 10px 18px; border-radius: 50px; border: 1.5px solid var(--color-border); outline: none; background: #ffffff; font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; cursor: pointer;">
                    <option value="all">All Locations</option>
                </select>
            </div>
        </section>

        <!-- Dynamic Theatres Container (Loaded via script.js) -->
        <section class="page-content" style="padding-top: 10px;">
            <div class="container" id="theatre-list">
                <!-- Dynamically populated from data/theatres.json -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <!-- Dynamic Newsletter & Links injected by script.js -->
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
