<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disneyland Paris Sensory & ADHD Guide | Behind the Magic Curtain</title>
    <meta name="description" content="Parent-tested sensory scores, ADHD queue tips, and interactive ratings for every ride, show, and experience at Disneyland Paris.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Disneyland Paris Sensory Guide | Behind the Magic Curtain">
    <meta property="og:description" content="Thrill, fear, noise, and darkness ratings for every attraction at Disneyland Paris.">
    <meta property="og:image" content="images/dlp-castle.webp">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700&family=Raleway:wght@500;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .dlp-hero { background: linear-gradient(135deg, #005587 0%, #002244 100%); color: #fff; text-align: center; padding: 60px 20px; }
        .dlp-hero h1 { color: #fff; font-size: clamp(2.2rem, 5vw, 3.4rem); margin-bottom: 8px; }
        .dlp-hero p { color: #ffd700; font-family: var(--font-subheading); font-size: 1.2rem; }
        
        .dlp-filter-toolbar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin: 30px 0 20px 0; }
        .dlp-search-input { flex: 1 1 280px; max-width: 480px; padding: 10px 18px; border-radius: 50px; border: 1.5px solid var(--color-border); outline: none; font-family: var(--font-body); font-size: 0.95rem; }
        
        .dlp-card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; margin-top: 20px; }
        .dlp-card { background: #fff; border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 22px; box-shadow: var(--shadow-card); display: flex; flex-direction: column; transition: transform 0.25s, box-shadow 0.25s; }
        .dlp-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
        .dlp-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .dlp-card-header h3 { margin: 0; font-size: 1.25rem; color: var(--color-primary); }
        .dlp-loc-badge { font-size: 0.8rem; font-weight: 600; color: #555; margin-bottom: 12px; display: block; }
        
        .score-bar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 14px; }
        .score-item { display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 600; color: #333; }
        .score-val { color: var(--color-accent); font-weight: 700; }
        
        .dlp-notes-box { font-size: 0.88rem; color: #444; line-height: 1.5; margin-bottom: 10px; }
        .dlp-adhd-box { font-size: 0.85rem; color: #00695c; background: #e0f2f1; padding: 10px 12px; border-radius: 6px; line-height: 1.4; border-left: 3px solid #00838f; margin-top: auto; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="logo"><a href="index.html">Behind the Magic Curtain</a></div>
            <nav class="main-nav">
                <button class="nav-toggle" aria-label="toggle navigation"><span class="hamburger"></span></button>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="whats-on.html">What's On</a></li>
                    <li><a href="theatre-guide.html">Theatre Guide</a></li>
                    <li><a href="tips-for-parents.html">Tips for Parents</a></li>
                    <li><a href="reviews.html">Reviews</a></li>
                    <li><a href="news.html">News</a></li>
                    <li><a href="disneyland-paris.html" class="active">Disneyland Paris</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="dlp-hero">
            <div class="container">
                <h1>Disneyland Paris Sensory Guide</h1>
                <p>Parent-tested sensory scores & ADHD tips for every ride, show, and experience.</p>
            </div>
        </section>

        <section class="page-content">
            <div class="container">
                <!-- Search & Filters -->
                <div class="dlp-filter-toolbar">
                    <input type="search" id="dlp-attraction-search" class="dlp-search-input" placeholder="Search ride name, land, or sensory keyword...">
                </div>
                <div class="filter-buttons" style="justify-content: center; margin-bottom: 25px;">
                    <button type="button" class="filter-btn active" data-filter="all">All Attractions</button>
                    <button type="button" class="filter-btn" data-filter="Ride">Rides & Coasters</button>
                    <button type="button" class="filter-btn" data-filter="Show">Shows & Parades</button>
                    <button type="button" class="filter-btn" data-filter="Experience">Walkthroughs & Meets</button>
                </div>

                <!-- Live Container -->
                <div id="dlp-attractions-grid" class="dlp-card-grid">
                    <!-- Loaded dynamically from data/disneyland.json -->
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container"></div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
